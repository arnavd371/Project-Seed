<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seed | बीज</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F4EF;
      --fg: #000000;
      --muted: #686868;
      --border: #000000;
      --hairline: rgba(0,0,0,0.12);
      --card: #F5F4EF;
      --urgent-bg: #f0ece4;
      --font-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      text-align: center;
    }
    ::selection { background: rgba(0,0,0,0.12); }

    .shell { padding: 1.25rem 1rem 3rem; }
    @media (min-width: 768px) { .shell { padding: 2.5rem 1.5rem 4rem; } }

    .wrap {
      width: 100%;
      max-width: 52rem;
      margin: 0 auto;
      text-align: center;
    }

    header.top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .brand {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 2.75rem);
      font-weight: 500;
      color: var(--fg);
      text-decoration: none;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .brand .hi {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--muted);
      display: block;
      margin-top: 0.35rem;
      font-weight: 400;
    }

    .tagline {
      max-width: 34rem;
      margin: 0 auto;
      color: var(--muted);
      font-size: 0.8rem;
    }

    nav.links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.65rem 1.1rem;
      margin-top: 0.25rem;
    }
    nav.links button {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      background: none;
      border: none;
      padding: 0;
      color: var(--fg);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: rgba(0,0,0,0.25);
    }
    nav.links button:hover,
    nav.links button.active { text-decoration-color: var(--fg); }

    .lede {
      max-width: 40rem;
      margin: 0 auto 1.5rem;
      color: var(--fg);
    }

    .section-label {
      font-family: var(--font-serif);
      font-size: 1.35rem;
      font-weight: 500;
      margin: 1.75rem auto 0.85rem;
      letter-spacing: -0.01em;
    }
    .section-sub {
      color: var(--muted);
      font-size: 0.78rem;
      margin: -0.35rem auto 1rem;
      max-width: 36rem;
    }

    .pi-box {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 5px 5px 0 0 var(--border);
      padding: 1rem 1.15rem;
      margin: 0 auto 1rem;
      max-width: 44rem;
      text-align: left;
    }
    .pi-box.center-text { text-align: center; }
    .pi-box-title {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 1.05rem;
      margin-bottom: 0.35rem;
      letter-spacing: -0.01em;
    }
    .pi-box-meta {
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 0.4rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin: 1.25rem auto;
      max-width: 44rem;
    }
    @media (min-width: 640px) { .stats { grid-template-columns: repeat(4, 1fr); } }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 3px 3px 0 0 var(--border);
      padding: 0.85rem 0.6rem;
      text-align: center;
    }
    .stat .n { font-size: 1.35rem; font-weight: 700; }
    .stat .l { color: var(--muted); font-size: 0.68rem; margin-top: 0.2rem; line-height: 1.35; }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
      max-width: 44rem;
      margin: 0 auto 1rem;
    }
    @media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .grid2 .pi-box { margin: 0; max-width: none; }

    label {
      display: block;
      margin: 0.85rem 0 0.3rem;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: left;
    }
    select {
      width: 100%;
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 0.55rem 0.65rem;
      box-shadow: 3px 3px 0 0 var(--border);
      text-align: left;
    }
    select:focus { outline: none; box-shadow: 2px 2px 0 0 var(--border); }

    button.primary {
      font: inherit;
      color: #fff;
      background: var(--fg);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 0.6rem 1.1rem;
      margin-top: 1rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 0 var(--border);
    }
    button.primary:hover {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 0 var(--border);
    }

    .urgency-0 { border-left: 4px solid #4a7c59; }
    .urgency-1 { border-left: 4px solid #9a7b2e; }
    .urgency-2 { border-left: 4px solid #a84848; }
    .urgency-3 { border-left: 4px solid var(--fg); background: var(--urgent-bg); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
      text-align: left;
    }
    th, td {
      border-bottom: 1px solid var(--hairline);
      padding: 0.4rem 0.25rem;
      vertical-align: top;
      font-size: 0.8rem;
    }
    th {
      color: var(--muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }

    .muted { color: var(--muted); }
    pre {
      white-space: pre-wrap;
      margin: 0;
      font: inherit;
      line-height: 1.7;
      text-align: left;
    }
    ul { margin: 0.4rem 0 0; padding-left: 1.2rem; text-align: left; }
    li { margin: 0.25rem 0; }

    .footer {
      margin: 2.75rem auto 0;
      padding-top: 1rem;
      border-top: 1px solid var(--hairline);
      color: var(--muted);
      font-size: 0.75rem;
      max-width: 40rem;
    }
    .err { color: #a84848; }
    a.inline {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(0,0,0,0.25);
    }
    a.inline:hover { text-decoration-color: var(--fg); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="wrap">
      <header class="top">
        <a class="brand" href="#" id="brand">
          Seed
          <span class="hi">बीज</span>
        </a>
        <p class="tagline">India-calibrated pharmacogenomics. Because Indian genes are not European genes.</p>
        <nav class="links" id="nav"></nav>
      </header>
      <div id="app"><p class="muted">Loading…</p></div>
      <div class="footer">
        Decision support only · not a diagnostic device · Open source · Offline-capable ·
        <a class="inline" href="https://github.com/arnavd371/Project-Seed" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </div>
  </div>
  <script>
    const PAGES = ["home","analyse","impact","methods","technical","research"];
    let DATA = null;
    let state = { page: "home", gene: null, genotype: null, result: null };

    const urgencyText = {
      0: "No immediate pharmacogenomic action required for this genotype.",
      1: "Moderate significance. Consider this genotype when prescribing affected drugs.",
      2: "Significant. Dose or drug-choice adjustment should be considered.",
      3: "URGENT. This genotype may cause serious harm with standard dosing of affected drugs.",
    };

    async function boot() {
      const res = await fetch("./data/seed_payload.json");
      if (!res.ok) throw new Error("Failed to load seed_payload.json");
      DATA = await res.json();
      const genes = Object.keys(DATA.genes).sort();
      state.gene = genes[0];
      state.genotype = Object.keys(DATA.genes[state.gene])[0];
      document.getElementById("brand").onclick = (e) => {
        e.preventDefault();
        state.page = "home";
        state.result = null;
        renderNav();
        render();
      };
      renderNav();
      render();
    }

    function label(p) {
      return ({
        home: "Home",
        analyse: "Analyse",
        impact: "Impact",
        methods: "Why AI",
        technical: "Technical",
        research: "Research",
      })[p];
    }

    function renderNav() {
      const nav = document.getElementById("nav");
      nav.innerHTML = PAGES.map((p) =>
        `<button data-page="${p}" class="${state.page === p ? "active" : ""}">${label(p)}</button>`
      ).join("");
      nav.querySelectorAll("button").forEach((btn) => {
        btn.onclick = () => {
          state.page = btn.dataset.page;
          if (state.page !== "analyse") state.result = null;
          renderNav();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
      });
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    function render() {
      document.getElementById("app").innerHTML = ({
        home: renderHome,
        analyse: renderAnalyse,
        impact: renderImpact,
        methods: renderMethods,
        technical: renderTechnical,
        research: renderResearch,
      })[state.page]();
      bindAnalyse();
    }

    function renderHome() {
      const m = DATA.urgency_shift_metrics || {};
      const acc = m.accuracy != null ? (m.accuracy * 100).toFixed(1) : "87.5";
      const f1 = m.macro_f1 != null ? m.macro_f1.toFixed(2) : "0.86";
      return `
        <p class="lede">
          Standard pharmacogenomic tools are calibrated on European allele frequencies.
          Seed trains an India Urgency Shift model that asks a sharper question: for this
          genotype, should a South Asian patient be treated as higher urgency than CPIC text alone?
        </p>
        <div class="stats">
          <div class="stat"><div class="n">6,035</div><div class="l">Real SAS individual rows</div></div>
          <div class="stat"><div class="n">168</div><div class="l">Genotype groups trained</div></div>
          <div class="stat"><div class="n">${acc}%</div><div class="l">Urgency Shift CV accuracy</div></div>
          <div class="stat"><div class="n">${f1}</div><div class="l">Urgency Shift macro F1</div></div>
        </div>
        <div class="pi-box center-text">
          <div class="pi-box-title">Try India Urgency Shift</div>
          <p class="muted">Analyse a real SAS-observed genotype and see whether population structure pushes urgency up for Indian patients.</p>
          <p><button class="primary" id="go-analyse">Enter Analyse</button></p>
        </div>`;
    }

    function renderAnalyse() {
      const genes = Object.keys(DATA.genes).sort();
      const gts = Object.keys(DATA.genes[state.gene] || {}).sort(
        (a, b) =>
          (DATA.genes[state.gene][b].n_real_individuals || 0) -
          (DATA.genes[state.gene][a].n_real_individuals || 0)
      );
      const geneOpts = genes
        .map((g) => `<option value="${esc(g)}" ${g === state.gene ? "selected" : ""}>${esc(g)}</option>`)
        .join("");
      const gtOpts = gts
        .map((gt) => {
          const n = DATA.genes[state.gene][gt].n_real_individuals;
          return `<option value="${esc(gt)}" ${gt === state.genotype ? "selected" : ""}>${esc(gt)} · ${n} real individuals</option>`;
        })
        .join("");
      return `
        <div class="section-label">Analyse</div>
        <p class="section-sub">Only genotypes observed in real 1000 Genomes SAS data are listed.</p>
        <div class="pi-box">
          <div class="pi-box-title">Gene and genotype</div>
          <label for="gene">Gene</label>
          <select id="gene">${geneOpts}</select>
          <label for="genotype">Genotype</label>
          <select id="genotype">${gtOpts}</select>
          <div style="text-align:center"><button class="primary" id="run">Analyse Genotype</button></div>
        </div>
        <div id="result">${state.result ? renderResult(state.result) : ""}</div>`;
    }

    function renderResult(r) {
      const cls = r.observed_clinical_significance;
      const pops = DATA.meta.sas_populations
        .map((p) => {
          const v = r.population_breakdown[p];
          const name = DATA.meta.sas_population_names[p];
          return `<tr><td>${esc(name)}</td><td>${esc(p)}</td><td>${v == null ? "N/A" : v + "%"}</td></tr>`;
        })
        .join("");
      const drugs =
        (r.drugs || [])
          .map((d) => `<tr><td>${esc(d)}</td><td>${esc(r.observed_clinical_significance_label)}</td></tr>`)
          .join("") ||
        `<tr><td colspan="2">No CPIC drug associations on file for this gene.</td></tr>`;
      const popOnly = r.population_only_predicted_label
        ? `${esc(r.population_only_predicted_label)} (${(r.population_only_confidence * 100).toFixed(1)}%)`
        : "N/A";
      return `
        <div class="pi-box urgency-${cls}">
          <div class="pi-box-title">${esc(urgencyText[cls])}</div>
          <div class="pi-box-meta">${esc(r.gene)} ${esc(r.genotype)} → ${esc(r.phenotype)} (${esc(r.observed_clinical_significance_label)})</div>
        </div>
        ${renderShiftBox(r)}
        <div class="grid2">
          <div class="pi-box"><div class="pi-box-title">Calibration ML</div><strong>${esc(r.india_predicted_label)}</strong> (${(r.india_confidence * 100).toFixed(1)}%)</div>
          <div class="pi-box"><div class="pi-box-title">Global baseline</div><strong>${esc(r.baseline_predicted_label)}</strong> (${(r.baseline_confidence * 100).toFixed(1)}%)</div>
          <div class="pi-box"><div class="pi-box-title">Population-only ML</div><strong>${popOnly}</strong><p class="muted" style="margin:0.4rem 0 0">Frequency structure only - no CPIC score in features.</p></div>
          <div class="pi-box"><div class="pi-box-title">Frequencies</div>
            SAS ${Number(r.india_diplotype_freq).toFixed(4)} ·
            EUR ${Number(r.european_diplotype_freq).toFixed(4)} ·
            SAS/EUR ${Number(r.sas_vs_eur_ratio).toFixed(2)} ·
            n = ${r.n_real_individuals}
          </div>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">SAS subpopulation breakdown</div>
          <table><thead><tr><th>Subpopulation</th><th>Code</th><th>% carrying</th></tr></thead><tbody>${pops}</tbody></table>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Clinical interpretation</div>
          <p><strong>${esc(r.gene)}</strong> (${esc(r.full_name)}) · CPIC ${esc(r.cpic_level)} · phenotype <strong>${esc(r.phenotype)}</strong></p>
          <table><thead><tr><th>Affected drug</th><th>Significance</th></tr></thead><tbody>${drugs}</tbody></table>
          ${r.india_relevance_note ? `<p style="margin-top:0.75rem;"><span class="muted">India-specific note</span><br>${esc(r.india_relevance_note)}</p>` : ""}
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Hindi summary</div>
          <pre>${esc(r.hindi_summary)}</pre>
        </div>`;
    }

    function renderShiftBox(r) {
      if (!r.urgency_shift_available) return "";
      const higher = Number(r.urgency_shift_predicted_class) === 1;
      const prob = ((r.urgency_shift_prob_higher ?? 0) * 100).toFixed(1);
      const title = higher
        ? "India Urgency Shift: higher than CPIC text alone"
        : "India Urgency Shift: no upward shift";
      const body = higher
        ? `Population structure suggests this genotype deserves higher urgency for South Asian patients than European CPIC wording alone implies. Model confidence in upward shift: ${prob}%.`
        : `No upward India-specific urgency shift predicted from population structure. Probability of higher urgency: ${prob}%.`;
      return `<div class="pi-box ${higher ? "urgency-2" : ""}">
          <div class="pi-box-title">${title}</div>
          <p>${body}</p>
          <p class="muted" style="margin:0.5rem 0 0">Trained XGBoost on 168 real SAS genotype groups · grouped CV accuracy ${(DATA.urgency_shift_metrics?.accuracy * 100 || 87.5).toFixed(1)}%</p>
        </div>`;
    }

    function bindAnalyse() {
      const go = document.getElementById("go-analyse");
      if (go) go.onclick = () => { state.page = "analyse"; renderNav(); render(); };
      const gene = document.getElementById("gene");
      const gt = document.getElementById("genotype");
      const run = document.getElementById("run");
      if (gene) gene.onchange = () => {
        state.gene = gene.value;
        state.genotype = Object.keys(DATA.genes[state.gene])[0];
        state.result = null;
        render();
      };
      if (gt) gt.onchange = () => { state.genotype = gt.value; };
      if (run) run.onclick = () => {
        state.gene = gene.value;
        state.genotype = gt.value;
        state.result = DATA.genes[state.gene][state.genotype];
        render();
        document.getElementById("result")?.scrollIntoView({ behavior: "smooth", block: "start" });
      };
    }

    function renderImpact() {
      const cites = (DATA.content.citations || []).map((c) =>
        `<div class="pi-box"><div class="pi-box-title">${esc(c.text)}</div><div class="pi-box-meta">${esc(c.source || "")}</div></div>`
      ).join("");
      const aud = (DATA.content.audience || []).map((a) =>
        `<tr><td>${esc(a.k)}</td><td>${esc(a.v)}</td></tr>`
      ).join("");
      const sdg = (DATA.content.sdg || []).map((s) =>
        `<tr><td>${esc(s.sdg)}</td><td>${esc(s.mapping)}</td></tr>`
      ).join("");
      const acc = (DATA.content.accessibility || []).map((a) => `<li>${esc(a)}</li>`).join("");

      return `
        <div class="section-label">Impact</div>
        <p class="section-sub">Who Seed is for, and why population calibration matters.</p>
        <div class="pi-box">
          <div class="pi-box-title">The gap</div>
          <p>European-calibrated pharmacogenomic tools can mis-estimate prescribing risk when allele frequencies differ in South Asia. That matters for clopidogrel (CYP2C19), fluoropyrimidines (DPYD), and thiopurines (NUDT15) across India and the diaspora.</p>
        </div>
        <div class="section-label" style="font-size:1.1rem">Evidence</div>
        ${cites}
        <div class="pi-box">
          <div class="pi-box-title">Who it serves</div>
          <table><tbody>${aud}</tbody></table>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Access</div>
          <ul>${acc}</ul>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Sustainable Development Goals</div>
          <table><thead><tr><th>SDG</th><th>How Seed connects</th></tr></thead><tbody>${sdg}</tbody></table>
        </div>`;
    }

    function renderMethods() {
      const gtm = (DATA.content.gtm || []).map((a) =>
        `<tr><td>${esc(a.k)}</td><td>${esc(a.v)}</td></tr>`
      ).join("");
      const eth = (DATA.content.ethics || []).map((a) =>
        `<tr><td>${esc(a.k)}</td><td>${esc(a.v)}</td></tr>`
      ).join("");
      const m = DATA.urgency_shift_metrics || {};

      return `
        <div class="section-label">Why AI</div>
        <p class="section-sub">What rules already do - and what the Urgency Shift model adds.</p>
        <div class="pi-box">
          <div class="pi-box-title">India Urgency Shift</div>
          <p>CPIC tells you the phenotype class. Seed's new model predicts whether South Asian population structure should push urgency <strong>higher</strong> than that CPIC text alone - trained on 168 real genotype groups (grouped CV accuracy ${m.accuracy ?? 0.875}).</p>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Beyond a lookup table</div>
          <pre>${esc(DATA.content.why_ai || "")}</pre>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Data</div>
          <p>Parsed from public 1000 Genomes Project South Asian WGS (GIH, PJL, ITU, STU, BEB), joined with CPIC gene-drug guidance. Real rows only. SMOTE was evaluated and rejected for the tiny urgent class.</p>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Ethics, privacy, environment</div>
          <table><tbody>${eth}</tbody></table>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Path forward</div>
          <table><tbody>${gtm}</tbody></table>
        </div>`;
    }

    function renderTechnical() {
      const techRows = Object.entries(DATA.content.tech || {}).map(([k, v]) =>
        `<tr><td>${esc(k)}</td><td>${esc(Array.isArray(v) ? v.join(", ") : v)}</td></tr>`
      ).join("");

      return `
        <div class="section-label">Technical</div>
        <p class="section-sub">Stack, hardware, and how the hosted demo relates to the full offline app.</p>
        <div class="pi-box">
          <div class="pi-box-title">Stack</div>
          <table><tbody>${techRows}</tbody></table>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Hardware</div>
          <p>Trains and runs on a general-purpose laptop or desktop. No GPU required - intentional for clinic and classroom machines.</p>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">This site vs the full app</div>
          <p>This page serves precomputed model outputs for all 168 observed genotypes. The repository also includes the full Streamlit app (<code>streamlit_app.py</code>) for fully offline local use with charts, PDF export, and simulations.</p>
        </div>`;
    }

    function metric(key, name) {
      const b = (DATA.comparison || {})[key] || {};
      return `<tr><td>${esc(name)}</td><td>${b.accuracy ?? "-"}</td><td>${b.macro_f1 ?? "-"}</td></tr>`;
    }

    function renderResearch() {
      const m = DATA.urgency_shift_metrics || {};
      return `
        <div class="section-label">Research</div>
        <p class="section-sub">Honest group-level metrics. Each genotype counts once.</p>
        <div class="pi-box">
          <div class="pi-box-title">India Urgency Shift (new)</div>
          <p>Binary XGBoost predicting whether population-adjusted urgency is higher than CPIC clinical significance alone. Features are population structure only - no CPIC class label in the feature vector.</p>
          <table>
            <thead><tr><th>Metric</th><th>Value</th></tr></thead>
            <tbody>
              <tr><td>Grouped CV accuracy</td><td>${m.accuracy ?? "-"}</td></tr>
              <tr><td>Macro F1</td><td>${m.macro_f1 ?? "-"}</td></tr>
              <tr><td>Train/CV accuracy gap</td><td>${m.overfitting_diagnosis?.accuracy_gap ?? "-"}</td></tr>
              <tr><td>Groups / splits</td><td>${m.n_groups ?? "-"} / ${m.n_splits ?? "-"}</td></tr>
            </tbody>
          </table>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Model comparison</div>
          <table>
            <thead><tr><th>Model</th><th>Accuracy</th><th>Macro F1</th></tr></thead>
            <tbody>
              ${metric("rule_baseline", "Rule baseline")}
              ${metric("population_only", "Population-only ML")}
              ${metric("india_calibrated", "Calibration ML")}
              ${metric("baseline", "Global baseline ML")}
            </tbody>
          </table>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Grouped cross-validation</div>
          <pre>6,035 rows but only 168 unique gene|genotype groups. Features are identical within a genotype.
Plain k-fold can put the same genotype in train and test, which inflates accuracy.
Grouped CV keeps all rows for one genotype in exactly one fold.</pre>
        </div>`;
    }

    boot().catch((err) => {
      document.getElementById("app").innerHTML = `<p class="err">${esc(err.message)}</p>`;
    });
  </script>
</body>
</html>
