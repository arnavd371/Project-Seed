<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seed | बीज</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F5F4EF;
      --fg: #000000;
      --muted: #686868;
      --border: #000000;
      --hairline: rgba(0,0,0,0.12);
      --card: #F5F4EF;
      --urgent-bg: #f0ece4;
      --font-serif: "IBM Plex Serif", Georgia, "Times New Roman", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 0.875rem;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(0,0,0,0.12); }

    .shell {
      padding: 1rem;
      overflow-x: hidden;
    }
    @media (min-width: 768px) {
      .shell { padding: 3rem; }
    }

    .wrap {
      width: 100%;
      max-width: 42rem;
    }
    .wrap.wide { max-width: 52rem; }

    header.top {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    @media (min-width: 768px) {
      header.top {
        flex-direction: row;
        align-items: center;
      }
    }

    .brand {
      font-family: var(--font-serif);
      font-size: 1.875rem;
      font-weight: 400;
      color: var(--fg);
      text-decoration: none;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .brand .hi {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--muted);
      display: block;
      margin-top: 0.2rem;
    }

    nav.links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.15rem;
    }
    nav.links button {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      background: none;
      border: none;
      padding: 0;
      color: var(--fg);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: rgba(0,0,0,0.25);
    }
    nav.links button:hover,
    nav.links button.active {
      text-decoration-color: var(--fg);
    }

    .lede {
      max-width: 36rem;
      margin: 0 0 1.75rem;
      color: var(--fg);
    }

    .pi-box {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 5px 5px 0 0 var(--border);
      padding: 0.85rem 1rem;
      margin: 0 0 1rem;
    }
    .pi-box h2, .pi-box h3 {
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 1.05rem;
      margin: 0 0 0.45rem;
      letter-spacing: -0.01em;
    }
    .pi-box-title {
      font-family: var(--font-serif);
      font-weight: 500;
      margin-bottom: 0.25rem;
    }
    .pi-box-meta {
      color: var(--muted);
      font-size: 0.75rem;
      margin-bottom: 0.35rem;
    }

    .timeline {
      position: relative;
      margin: 1.25rem 0 0;
      padding-left: 1.25rem;
      border-left: 1px solid var(--border);
    }
    .timeline-item {
      position: relative;
      margin: 0 0 1.25rem;
      padding-left: 0.35rem;
    }
    .timeline-item::before {
      content: "";
      position: absolute;
      left: -1.25rem;
      top: 0.45rem;
      width: 7px;
      height: 7px;
      background: var(--fg);
      transform: translateX(-50%);
    }
    .timeline-item.featured {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 5px 5px 0 0 var(--border);
      padding: 0.85rem 1rem;
      margin-left: 0.15rem;
    }
    .timeline-item.featured::before {
      left: calc(-1.25rem - 0.15rem);
    }
    .timeline-title {
      font-family: var(--font-serif);
      font-size: 1rem;
      margin: 0;
    }
    .timeline-meta {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin: 1.25rem 0;
    }
    @media (min-width: 640px) {
      .stats { grid-template-columns: repeat(4, 1fr); }
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: 3px 3px 0 0 var(--border);
      padding: 0.85rem;
      text-align: left;
    }
    .stat .n {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 700;
    }
    .stat .l {
      color: var(--muted);
      font-size: 0.7rem;
      margin-top: 0.2rem;
      line-height: 1.4;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
    }
    @media (min-width: 720px) {
      .grid2 { grid-template-columns: 1fr 1fr; }
    }

    label {
      display: block;
      margin: 0.85rem 0 0.3rem;
      color: var(--muted);
      font-size: 0.75rem;
    }
    select {
      width: 100%;
      font: inherit;
      color: var(--fg);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 0.55rem 0.65rem;
      box-shadow: 3px 3px 0 0 var(--border);
    }
    select:focus {
      outline: none;
      box-shadow: 2px 2px 0 0 var(--border);
    }

    button.primary {
      font: inherit;
      color: #fff;
      background: var(--fg);
      border: 1px solid var(--border);
      border-radius: 0;
      padding: 0.55rem 0.95rem;
      margin-top: 1rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 0 var(--border);
    }
    button.primary:hover {
      transform: translate(1px, 1px);
      box-shadow: 2px 2px 0 0 var(--border);
    }
    button.linkish {
      font-family: var(--font-serif);
      font-size: 1rem;
      background: none;
      border: none;
      padding: 0;
      color: var(--fg);
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-decoration-color: rgba(0,0,0,0.25);
    }
    button.linkish:hover { text-decoration-color: var(--fg); }

    .urgency-0 { border-left: 4px solid #4a7c59; }
    .urgency-1 { border-left: 4px solid #9a7b2e; }
    .urgency-2 { border-left: 4px solid #a84848; }
    .urgency-3 { border-left: 4px solid var(--fg); background: var(--urgent-bg); }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }
    th, td {
      border-bottom: 1px solid var(--hairline);
      padding: 0.4rem 0.25rem;
      text-align: left;
      vertical-align: top;
      font-size: 0.8rem;
    }
    th {
      color: var(--muted);
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }

    .muted { color: var(--muted); }
    .section-label {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 500;
      margin: 1.5rem 0 0.75rem;
    }
    pre {
      white-space: pre-wrap;
      margin: 0;
      font: inherit;
      line-height: 1.7;
    }
    .footer {
      margin-top: 2.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--hairline);
      color: var(--muted);
      font-size: 0.75rem;
      max-width: 36rem;
    }
    .err { color: #a84848; }
    a.inline {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(0,0,0,0.25);
    }
    a.inline:hover { text-decoration-color: var(--fg); }
  </style>
</head>
<body>
  <div class="shell">
    <div class="wrap wide" id="frame">
      <header class="top">
        <a class="brand" href="#" id="brand">
          Seed
          <span class="hi">बीज · India-calibrated pharmacogenomics</span>
        </a>
        <nav class="links" id="nav"></nav>
      </header>
      <div id="app"><p class="muted">Loading…</p></div>
      <div class="footer">
        Decision support only · not a diagnostic device · Open source ·
        Precomputed from real 1000 Genomes SAS models ·
        <a class="inline" href="https://github.com/arnavd371/Project-Seed" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </div>
  </div>
  <script>
    const PAGES = ["home","analyse","performance","impact","ai","technical"];
    let DATA = null;
    let state = { page: "home", gene: null, genotype: null, result: null };

    const urgencyText = {
      0: "No immediate pharmacogenomic action required for this genotype.",
      1: "Moderate significance. Consider this genotype when prescribing affected drugs.",
      2: "Significant. Dose or drug-choice adjustment should be considered.",
      3: "URGENT. This genotype may cause serious harm with standard dosing of affected drugs.",
    };

    async function boot() {
      const res = await fetch("./data/seed_payload.json");
      if (!res.ok) throw new Error("Failed to load seed_payload.json");
      DATA = await res.json();
      const genes = Object.keys(DATA.genes).sort();
      state.gene = genes[0];
      state.genotype = Object.keys(DATA.genes[state.gene])[0];
      document.getElementById("brand").onclick = (e) => {
        e.preventDefault();
        state.page = "home";
        state.result = null;
        renderNav();
        render();
      };
      renderNav();
      render();
    }

    function label(p) {
      return ({
        home: "Home",
        analyse: "Analyse",
        performance: "Research",
        impact: "Impact",
        ai: "Innovation",
        technical: "Technical",
      })[p];
    }

    function renderNav() {
      const nav = document.getElementById("nav");
      nav.innerHTML = PAGES.map((p) =>
        `<button data-page="${p}" class="${state.page === p ? "active" : ""}">${label(p)}</button>`
      ).join("");
      nav.querySelectorAll("button").forEach((btn) => {
        btn.onclick = () => {
          state.page = btn.dataset.page;
          if (state.page !== "analyse") state.result = null;
          renderNav();
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
      });
    }

    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
      );
    }

    function render() {
      document.getElementById("app").innerHTML = ({
        home: renderHome,
        analyse: renderAnalyse,
        performance: renderPerf,
        impact: renderImpact,
        ai: renderAI,
        technical: renderTech,
      })[state.page]();
      bindAnalyse();
    }

    function renderHome() {
      return `
        <p class="lede">
          Standard pharmacogenomic tools are calibrated on European allele frequencies.
          Seed is trained on real 1000 Genomes Project South Asian genomes and reports
          honest grouped cross-validation metrics - every frequency traceable to observed individuals.
        </p>
        <div class="stats">
          <div class="stat"><div class="n">6,035</div><div class="l">Real SAS individual rows</div></div>
          <div class="stat"><div class="n">489</div><div class="l">South Asian genomes</div></div>
          <div class="stat"><div class="n">168</div><div class="l">Unique gene-genotype groups</div></div>
          <div class="stat"><div class="n">0</div><div class="l">Synthetic / SMOTE rows</div></div>
        </div>
        <div class="timeline">
          <div class="timeline-item featured">
            <p class="timeline-title">Analyse a real SAS genotype</p>
            <p class="timeline-meta">CYP2C19 · DPYD · NUDT15 · and 168 observed groups</p>
            <p>Compare Calibration ML, population-only ML, and European baseline on the same genotype.</p>
            <p style="margin-top:0.75rem;"><button class="linkish" id="go-analyse">Enter Analyse →</button></p>
          </div>
          <div class="timeline-item">
            <p class="timeline-title">Research notes</p>
            <p class="timeline-meta">Grouped CV · gene holdout · honest metrics</p>
            <p class="muted">Population-only ~59% vs calibrated ~96% on group-level accuracy.</p>
          </div>
          <div class="timeline-item">
            <p class="timeline-title">Offline by design</p>
            <p class="timeline-meta">No LLM · no API keys · open source</p>
            <p class="muted">This hosted demo serves precomputed model outputs for submission and review.</p>
          </div>
        </div>`;
    }

    function renderAnalyse() {
      const genes = Object.keys(DATA.genes).sort();
      const gts = Object.keys(DATA.genes[state.gene] || {}).sort(
        (a, b) =>
          (DATA.genes[state.gene][b].n_real_individuals || 0) -
          (DATA.genes[state.gene][a].n_real_individuals || 0)
      );
      const geneOpts = genes
        .map((g) => `<option value="${esc(g)}" ${g === state.gene ? "selected" : ""}>${esc(g)}</option>`)
        .join("");
      const gtOpts = gts
        .map((gt) => {
          const n = DATA.genes[state.gene][gt].n_real_individuals;
          return `<option value="${esc(gt)}" ${gt === state.genotype ? "selected" : ""}>${esc(gt)} · ${n} real individuals</option>`;
        })
        .join("");
      return `
        <p class="lede">Only genotypes observed in real 1000 Genomes SAS data are listed.</p>
        <div class="pi-box">
          <div class="pi-box-title">Analyse genotype</div>
          <label for="gene">Gene</label>
          <select id="gene">${geneOpts}</select>
          <label for="genotype">Genotype</label>
          <select id="genotype">${gtOpts}</select>
          <button class="primary" id="run">Analyse Genotype</button>
        </div>
        <div id="result">${state.result ? renderResult(state.result) : ""}</div>`;
    }

    function renderResult(r) {
      const cls = r.observed_clinical_significance;
      const pops = DATA.meta.sas_populations
        .map((p) => {
          const v = r.population_breakdown[p];
          const name = DATA.meta.sas_population_names[p];
          return `<tr><td>${esc(name)}</td><td>${esc(p)}</td><td>${v == null ? "N/A" : v + "%"}</td></tr>`;
        })
        .join("");
      const drugs =
        (r.drugs || [])
          .map(
            (d) =>
              `<tr><td>${esc(d)}</td><td>${esc(r.observed_clinical_significance_label)}</td></tr>`
          )
          .join("") ||
        `<tr><td colspan="2">No CPIC drug associations on file for this gene.</td></tr>`;
      const popOnly = r.population_only_predicted_label
        ? `${esc(r.population_only_predicted_label)} (${(r.population_only_confidence * 100).toFixed(1)}%)`
        : "N/A";
      return `
        <div class="pi-box urgency-${cls}">
          <div class="pi-box-title">${esc(urgencyText[cls])}</div>
          <div class="pi-box-meta">${esc(r.gene)} ${esc(r.genotype)} → ${esc(r.phenotype)} (${esc(r.observed_clinical_significance_label)})</div>
        </div>
        <div class="grid2">
          <div class="pi-box"><div class="pi-box-title">Calibration ML</div><strong>${esc(r.india_predicted_label)}</strong> (${(r.india_confidence * 100).toFixed(1)}%)</div>
          <div class="pi-box"><div class="pi-box-title">Global baseline</div><strong>${esc(r.baseline_predicted_label)}</strong> (${(r.baseline_confidence * 100).toFixed(1)}%)</div>
          <div class="pi-box"><div class="pi-box-title">Population-only ML</div><strong>${popOnly}</strong></div>
          <div class="pi-box"><div class="pi-box-title">Frequencies</div>
            SAS ${Number(r.india_diplotype_freq).toFixed(4)} ·
            EUR ${Number(r.european_diplotype_freq).toFixed(4)} ·
            SAS/EUR ${Number(r.sas_vs_eur_ratio).toFixed(2)} ·
            n = ${r.n_real_individuals}
          </div>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">SAS subpopulation breakdown</div>
          <table><thead><tr><th>Subpopulation</th><th>Code</th><th>% carrying</th></tr></thead><tbody>${pops}</tbody></table>
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Clinical interpretation</div>
          <p><strong>${esc(r.gene)}</strong> (${esc(r.full_name)}) · CPIC ${esc(r.cpic_level)} · phenotype <strong>${esc(r.phenotype)}</strong></p>
          <table><thead><tr><th>Affected drug</th><th>Significance</th></tr></thead><tbody>${drugs}</tbody></table>
          ${r.india_relevance_note ? `<p style="margin-top:0.75rem;"><span class="muted">India-specific note</span><br>${esc(r.india_relevance_note)}</p>` : ""}
        </div>
        <div class="pi-box">
          <div class="pi-box-title">Hindi summary</div>
          <pre>${esc(r.hindi_summary)}</pre>
        </div>`;
    }

    function bindAnalyse() {
      const go = document.getElementById("go-analyse");
      if (go)
        go.onclick = () => {
          state.page = "analyse";
          renderNav();
          render();
        };
      const gene = document.getElementById("gene");
      const gt = document.getElementById("genotype");
      const run = document.getElementById("run");
      if (gene)
        gene.onchange = () => {
          state.gene = gene.value;
          state.genotype = Object.keys(DATA.genes[state.gene])[0];
          state.result = null;
          render();
        };
      if (gt) gt.onchange = () => { state.genotype = gt.value; };
      if (run)
        run.onclick = () => {
          state.gene = gene.value;
          state.genotype = gt.value;
          state.result = DATA.genes[state.gene][state.genotype];
          render();
          document.getElementById("result")?.scrollIntoView({ behavior: "smooth", block: "start" });
        };
    }

    function metric(key, name) {
      const b = DATA.comparison[key] || {};
      return `<tr><td>${esc(name)}</td><td>${b.accuracy ?? "—"}</td><td>${b.macro_f1 ?? "—"}</td></tr>`;
    }

    function renderPerf() {
      return `
        <p class="lede">Group-level metrics - each genotype counts once. Plain row-level CV was rejected after duplicate-genotype leakage.</p>
        <div class="pi-box">
          <div class="pi-box-title">Model comparison</div>
          <table>
            <thead><tr><th>Model</th><th>Accuracy</th><th>Macro F1</th></tr></thead>
            <tbody>
              ${metric("rule_baseline", "Rule baseline")}
              ${metric("population_only", "Population-only ML")}
              ${metric("india_calibrated", "Calibration ML")}
              ${metric("baseline", "Global baseline ML")}
            </tbody>
          </table>
        </div>`;
    }

    function renderImpact() {
      const cites = DATA.content.citations
        .map(
          (c) => `
          <div class="timeline-item featured">
            <p class="timeline-title">[${c.id}] ${esc(c.text)}</p>
            <p class="timeline-meta">${esc(c.source || "")}</p>
          </div>`
        )
        .join("");
      const sdg = DATA.content.sdg
        .map((s) => `<tr><td>${esc(s.sdg)}</td><td>${esc(s.mapping)}</td></tr>`)
        .join("");
      const aud = DATA.content.audience
        .map((a) => `<tr><td>${esc(a.k)}</td><td>${esc(a.v)}</td></tr>`)
        .join("");
      const acc = DATA.content.accessibility.map((a) => `<li>${esc(a)}</li>`).join("");
      return `
        <p class="lede">European-calibrated tools can mis-estimate prescribing risk for ~1.4B South Asians. Seed recalibrates CPIC context with real SAS allele-frequency structure.</p>
        <div class="section-label">Evidence</div>
        <div class="timeline">${cites}</div>
        <div class="pi-box"><div class="pi-box-title">Target audience</div><table><tbody>${aud}</tbody></table></div>
        <div class="pi-box"><div class="pi-box-title">SDG mapping</div><table><tbody>${sdg}</tbody></table></div>
        <div class="pi-box"><div class="pi-box-title">Accessibility</div><ul>${acc}</ul></div>`;
    }

    function renderAI() {
      const gtm = DATA.content.gtm
        .map((a) => `<tr><td>${esc(a.k)}</td><td>${esc(a.v)}</td></tr>`)
        .join("");
      const eth = DATA.content.ethics
        .map((a) => `<tr><td>${esc(a.k)}</td><td>${esc(a.v)}</td></tr>`)
        .join("");
      return `
        <div class="pi-box"><div class="pi-box-title">Why AI (not only rules)</div><pre>${esc(DATA.content.why_ai)}</pre></div>
        <div class="pi-box"><div class="pi-box-title">Go-to-market</div><table><tbody>${gtm}</tbody></table></div>
        <div class="pi-box"><div class="pi-box-title">Ethics &amp; privacy</div><table><tbody>${eth}</tbody></table></div>`;
    }

    function renderTech() {
      const tech = Object.entries(DATA.content.tech)
        .map(
          ([k, v]) =>
            `<tr><td>${esc(k)}</td><td>${esc(Array.isArray(v) ? v.join(", ") : v)}</td></tr>`
        )
        .join("");
      return `
        <p class="lede">Dual XGBoost classifiers on real SAS WGS-derived genotype groups. This hosted page serves precomputed outputs for all 168 observed genotypes.</p>
        <div class="pi-box"><div class="pi-box-title">Stack</div><table><tbody>${tech}</tbody></table></div>`;
    }

    boot().catch((err) => {
      document.getElementById("app").innerHTML = `<p class="err">${esc(err.message)}</p>`;
    });
  </script>
</body>
</html>
